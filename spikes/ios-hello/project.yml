name: RaaiCamSpike
options:
  bundleIdPrefix: com.raaicam
  deploymentTarget:
    iOS: "17.0"
targets:
  RaaiCamSpike:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: RaaiCam Spike
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "RaaiCam uses the camera to stream video to your PC."
        NSLocalNetworkUsageDescription: "RaaiCam connects to your PC over Wi-Fi."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raaicam.spike
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
